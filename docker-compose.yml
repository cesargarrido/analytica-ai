services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytica
      POSTGRES_PASSWORD: analytica
      POSTGRES_DB: analytica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytica -d analytica"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  engine:
    build: ./engine
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      DATABASE_URL: postgres://analytica:analytica@db:5432/analytica
      ENGINE_URL: http://engine:8000
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
